<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLYUNIVERSE — Retro Space Arcade for Kids</title>
  <meta name="description" content="A pixel-art space arcade! Tap a planet to hear its story, ask the Space Guide, and warp into deep space." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <!-- Critical CSS: paints before the JS module bundle loads (prevents FOUC) -->
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      overflow: hidden; background: #050510; color: #d8ffe8;
    }
    canvas#space { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #info-card, #planet-banner, #caption { opacity: 0; }
    #guide-panel { display: none; }
    #start-overlay {
      position: fixed; inset: 0; z-index: 30;
      background: #050510;
      display: flex; align-items: center; justify-content: center;
    }
    #boot-line {
      position: fixed; inset: 0; z-index: 40;
      display: grid; place-items: center;
      background: #050510; color: #59ff7e;
      font-family: monospace; font-size: 14px; letter-spacing: 0.12em;
    }
    body.app-ready #boot-line { display: none; }
  </style>
</head>
<body>
  <div id="boot-line" aria-hidden="true">LOADING FLYUNIVERSE…</div>
  <canvas id="space"></canvas>
  <div id="scanlines"></div>

  <div id="hud">
    <div id="top-bar">
      <button class="icon-btn" id="btn-home" type="button" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btn-sound" type="button" aria-label="Sound on" title="Sound">
        <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm9.5 3a3.5 3.5 0 0 0-1.5-2.87v5.74A3.5 3.5 0 0 0 13.5 12zm0-7.09v2.02a6.5 6.5 0 0 1 0 10.14v2.02a8.5 8.5 0 0 0 0-14.18z" fill="currentColor"/></svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm14.3 3 2.8 2.8-1.4 1.4L17 13.4l-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4 2.7 2.7 2.7-2.7 1.4 1.4-2.7 2.7 2.7 2.7-1.4 1.4L17 13.4z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btn-guide" type="button" aria-label="Space Guide" title="Ask about space">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.74V18a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.26A7 7 0 0 0 12 2zm0 2a5 5 0 0 1 3.87 8.18l-.37.44V18h-7v-5.38l-.37-.44A5 5 0 0 1 12 4zm-1 19h2v2h-2v-2z" fill="currentColor"/></svg>
      </button>
    </div>

    <div id="planet-banner"></div>
    <div id="caption"></div>

    <aside id="info-card">
      <div id="info-head">// PLANET DATA</div>
      <img id="info-thumb" alt="planet scan" width="128" height="64" />
      <h2 id="info-name"><a id="info-name-link" href="#" target="_blank" rel="noopener noreferrer">PLANET</a></h2>
      <p id="info-type">rocky world</p>
      <p id="info-distance"></p>
      <ul id="info-facts"></ul>
      <p id="info-source"></p>
    </aside>

    <div id="dock-view" class="dock">
      <span class="dock-label">CAM</span>
      <button class="px-btn view-btn" data-view="close">NEAR</button>
      <button class="px-btn view-btn active" data-view="system">SOL</button>
      <button class="px-btn view-btn" data-view="galaxy">GAL</button>
      <button class="px-btn view-btn" data-view="cluster">GRP</button>
      <button class="px-btn view-btn" data-view="universe">COS</button>
    </div>

    <aside id="guide-panel">
      <div class="guide-head">
        <span>// SPACE GUIDE</span>
        <button class="icon-btn icon-btn--sm" id="guide-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="guide-log"></div>
      <div id="guide-chips"></div>
      <div class="guide-input-row">
        <input id="guide-input" type="text" maxlength="120" placeholder="Ask about space..." autocomplete="off" />
        <button class="px-btn" id="guide-send" type="button">ASK</button>
      </div>
    </aside>
  </div>

  <div id="start-overlay">
    <div class="overlay-inner">
      <pre id="logo-rocket">
     /\
    /  \
   | () |
   |    |
  /| [] |\
 /_|____|_\
   *    *
  *  **  *</pre>
      <h1>FLY<br/>UNIVERSE</h1>
      <p class="tagline">&gt; TAP PLANETS &amp; CONSTELLATIONS. ASK THE SPACE GUIDE.<span class="blink">_</span></p>
      <button id="btn-launch" class="launch-btn">&#9658; BLAST OFF</button>
      <p class="credit">PIXEL SPACE ARCADE v1.0</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
